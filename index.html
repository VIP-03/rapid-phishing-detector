<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detection System</title>
    <style>
        :root {
            --bg: #eef4fb;
            --panel: #ffffff;
            --primary: #123d67;
            --primary-dark: #0e2d4d;
            --accent: #4da3ff;
            --border: #dfeaf5;
            --text: #1f2d3d;
            --muted: #5d7287;
            --success: #0b7a4c;
            --danger: #b42318;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #edf4ff 0%, #f7fafc 100%);
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(18, 61, 103, 0.08);
            padding: 32px;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: clamp(2rem, 3vw, 2.6rem);
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 8px;
            font-size: 1.02rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-dark);
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.98rem;
            background: #fbfdff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(77, 163, 255, 0.12);
        }

        .actions {
            margin-top: 22px;
        }

        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px 22px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 18px rgba(18, 61, 103, 0.18);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(18, 61, 103, 0.22);
        }

        .result {
            margin-top: 28px;
            display: none;
            background: #f4f9ff;
            border: 1px solid #d7ebff;
            border-left: 5px solid var(--accent);
            border-radius: 12px;
            padding: 18px 20px;
        }

        .result.visible {
            display: block;
        }

        .result h3 {
            margin: 0 0 12px;
            color: var(--primary);
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, monospace;
            font-size: 0.85rem;
            color: #243548;
        }

        @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .container { padding: 22px 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Phishing Detection System</h1>
            <div class="subtitle">Enter the relevant feature values to classify the input and review the prediction explanation.</div>
        </div>

        <form id="predictForm">
            <div class="grid" id="featureGrid"></div>
            <div class="actions" style="grid-column: 1 / -1;">
                <button type="submit">Predict</button>
            </div>
        </form>

        <div id="resultBox" class="result">
            <h3>Prediction Result</h3>
            <pre id="resultText"></pre>
        </div>
    </div>

    <script>
        const features = [
            'feature_1', 'feature_2', 'feature_3', 'feature_4', 'feature_5',
            'feature_6', 'feature_7', 'feature_8', 'feature_9', 'feature_10'
        ];

        const grid = document.getElementById('featureGrid');
        features.forEach((feature) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'field';
            wrapper.innerHTML = `
                <label for="${feature}">${feature}</label>
                <input type="number" step="any" id="${feature}" name="${feature}" required>
            `;
            grid.appendChild(wrapper);
        });

        document.getElementById('predictForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const payload = {};
            features.forEach((feature) => {
                payload[feature] = document.getElementById(feature).value;
            });

            const predictionResponse = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const predictionData = await predictionResponse.json();

            const explanationResponse = await fetch('/explain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const explanationData = await explanationResponse.json();

            document.getElementById('resultText').textContent = JSON.stringify({
                prediction: predictionData,
                explanation: explanationData
            }, null, 2);

            document.getElementById('resultBox').classList.add('visible');
        });
    </script>
</body>
</html>
